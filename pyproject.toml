[project]
name = "dsc190-assignment-6"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "williamchou500", email = "williamchou500@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
dsc190-assignment-6 = "dsc190_assignment_6:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
ignore_missing_imports = true
